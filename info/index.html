<!--
  Landing page for the printed QR code (signwriting, business cards, vehicles).

  Deliberately self-contained: no webfonts, no icon library, no external CSS.
  Someone scanning this is on a phone, often on mobile data outside the shop,
  and every extra request is a chance to look slow. One HTML request plus one
  logo, and the page is up.
-->
<style>
:root {
  --navy-deep: #1e2b38;
  --navy: #2c3e50;
  --navy-soft: #3a4a5c;
  --tan: #c19a6b;
  --tan-bright: #d4af86;
  --paper: #f5f5f5;
  --hairline: rgba(255, 255, 255, 0.13);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html { -webkit-text-size-adjust: 100%; }

body {
  min-height: 100svh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding:
    calc(2rem + env(safe-area-inset-top))
    calc(1.25rem + env(safe-area-inset-right))
    calc(2rem + env(safe-area-inset-bottom))
    calc(1.25rem + env(safe-area-inset-left));
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color: var(--paper);
  background: var(--navy-deep);
  /* Warm pool of light behind the logo, cooling towards the edges. */
  background-image:
    radial-gradient(120% 70% at 50% 0%, #46586c 0%, rgba(70, 88, 108, 0) 60%),
    linear-gradient(178deg, var(--navy) 0%, var(--navy-deep) 100%);
  background-attachment: fixed;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}

.card {
  width: 100%;
  max-width: 26rem;
  text-align: center;
}

/* ---------- Masthead ---------- */

.logo {
  width: min(78%, 17rem);
  height: auto;
  margin: 0 auto;
  display: block;
}

.tagline {
  margin-top: 1.15rem;
  font-size: 0.82rem;
  line-height: 1.55;
  font-weight: 400;
  letter-spacing: 0.02em;
  color: rgba(245, 245, 245, 0.66);
  text-wrap: balance;
}

.rule {
  width: 2.75rem;
  height: 1px;
  margin: 1.5rem auto;
  border: 0;
  background: linear-gradient(90deg, transparent, var(--tan), transparent);
}

/* ---------- Links ---------- */

.links {
  list-style: none;
  display: grid;
  gap: 0.7rem;
}

.link {
  display: flex;
  align-items: center;
  gap: 0.9rem;
  min-height: 3.5rem;          /* comfortably above the 44px tap-target floor */
  padding: 0.85rem 1.15rem;
  border: 1px solid var(--hairline);
  border-radius: 0.85rem;
  background: rgba(255, 255, 255, 0.055);
  color: var(--paper);
  text-decoration: none;
  font-size: 1rem;
  font-weight: 500;
  letter-spacing: 0.01em;
  transition: background 0.22s ease, border-color 0.22s ease, transform 0.12s ease;
}

.link:hover,
.link:focus-visible {
  background: rgba(255, 255, 255, 0.1);
  border-color: rgba(193, 154, 107, 0.55);
}

.link:focus-visible {
  outline: 2px solid var(--tan-bright);
  outline-offset: 3px;
}

.link:active { transform: scale(0.985); }

/* The primary action gets the brand's warm accent so the eye lands on it. */
.link--primary {
  background: var(--tan);
  border-color: var(--tan);
  color: #26313d;
  font-weight: 600;
}

.link--primary:hover,
.link--primary:focus-visible {
  background: var(--tan-bright);
  border-color: var(--tan-bright);
}

.link__icon {
  flex: 0 0 auto;
  width: 1.3rem;
  height: 1.3rem;
  display: block;
}

.link__text {
  flex: 1 1 auto;
  text-align: left;
  min-width: 0;
}

.link__sub {
  display: block;
  font-size: 0.72rem;
  font-weight: 400;
  letter-spacing: 0.015em;
  opacity: 0.62;
  margin-top: 0.1rem;
}

.link__chev {
  flex: 0 0 auto;
  width: 0.75rem;
  height: 0.75rem;
  opacity: 0.4;
}

/* ---------- Footer ---------- */

.foot {
  margin-top: 1.9rem;
  font-size: 0.72rem;
  line-height: 1.7;
  letter-spacing: 0.03em;
  color: rgba(245, 245, 245, 0.42);
}

.foot a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--hairline); }
.foot a:hover { color: var(--tan-bright); }

/* ---------- Entrance ---------- */

@media (prefers-reduced-motion: no-preference) {
  .reveal {
    animation: rise 0.55s cubic-bezier(0.22, 0.68, 0.3, 1) backwards;
  }
  .reveal:nth-child(1) { animation-delay: 0.02s; }
  .reveal:nth-child(2) { animation-delay: 0.08s; }
  .reveal:nth-child(3) { animation-delay: 0.13s; }
  .reveal:nth-child(4) { animation-delay: 0.18s; }
  .reveal:nth-child(5) { animation-delay: 0.23s; }
  .reveal:nth-child(6) { animation-delay: 0.28s; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(0.7rem); }
    to   { opacity: 1; transform: none; }
  }
}

/* Very short screens (landscape phones): tighten everything up. */
@media (max-height: 34rem) {
  body { align-items: flex-start; }
  .logo { width: min(58%, 13rem); }
  .rule { margin: 1.1rem auto; }
  .link { min-height: 3rem; }
}
</style>
</head>
